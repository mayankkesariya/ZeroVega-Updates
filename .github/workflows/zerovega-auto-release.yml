# ZeroVega GitHub -> Supabase mandatory update publisher.
# Install at .github/workflows/zerovega-auto-release.yml on the DEFAULT branch.
# A normal release runs it automatically; Run workflow can retry an existing release.
name: Publish ZeroVega release to Supabase

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing published release tag, for example v1.4'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: zerovega-supabase-production
  cancel-in-progress: false

jobs:
  update-supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
    steps:
      - name: Verify release, checksum installer, and update Supabase
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request

          def fail(message):
              raise SystemExit('ERROR: ' + message)

          def read_json(url, headers):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as exc:
                  fail(f'HTTP {exc.code} while contacting {urllib.parse.urlsplit(url).netloc}. Check GitHub release or Supabase secrets/permissions.')
              except urllib.error.URLError as exc:
                  fail(f'Cannot connect to {urllib.parse.urlsplit(url).netloc}: {exc.reason}')

          with open(os.environ['GITHUB_EVENT_PATH'], encoding='utf-8') as f:
              event = json.load(f)

          is_manual = os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch'
          if is_manual:
              tag = os.environ.get('RELEASE_TAG_INPUT', '').strip()
              if not re.fullmatch(r'v[0-9]+(?:\.[0-9]+){1,2}', tag):
                  fail('Enter an existing tag like v1.4 in Run workflow.')
              repo = os.environ['GITHUB_REPOSITORY']
              github_headers = {
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'User-Agent': 'ZeroVega-Release-Publisher',
              }
              github_url = f'https://api.github.com/repos/{repo}/releases/tags/{urllib.parse.quote(tag, safe="")}'
              release = read_json(github_url, github_headers)
          else:
              release = event['release']
              tag = release['tag_name']

          if release.get('draft') or release.get('prerelease'):
              fail('Only published normal releases can become mandatory.')
          if not re.fullmatch(r'v[0-9]+(?:\.[0-9]+){1,2}', tag):
              fail('Release tag must look like v1.4 or v1.4.1.')
          version = tag[1:]
          filename = f'ZeroVegaSetup_{version}.exe'
          assets = [a for a in release.get('assets', []) if a.get('name') == filename]
          if len(assets) != 1:
              fail(f'Exactly one attached asset named {filename} is required. Upload it before publishing.')
          asset = assets[0]
          download_url = asset['browser_download_url']
          if not download_url.startswith('https://github.com/') or '/releases/download/' not in download_url:
              fail('The installer must have a GitHub release asset download URL.')
          expected_size = int(asset.get('size', 0))
          if expected_size <= 0 or expected_size > 2 * 1024**3:
              fail('Installer size is invalid or exceeds the app downloader limit (2 GiB).')

          base = os.environ.get('SUPABASE_URL', '').strip().rstrip('/')
          key = os.environ.get('SUPABASE_SECRET_KEY', '').strip()
          if not re.fullmatch(r'https://[a-z0-9-]+\.supabase\.co', base):
              fail('GitHub Actions secret SUPABASE_URL must be your project base https://...supabase.co URL.')
          if not key.startswith('sb_secret_'):
              fail('GitHub Actions secret SUPABASE_SECRET_KEY must begin with sb_secret_.')

          api = base + '/rest/v1/app_config?config_key=eq.production'
          api_headers = {'apikey': key, 'Accept': 'application/json'}
          rows = read_json(api + '&select=latest_version', api_headers)
          if len(rows) != 1:
              fail('Supabase must contain exactly one app_config row where config_key = production.')

          def parts(value):
              if not isinstance(value, str) or not re.fullmatch(r'[0-9]+(?:\.[0-9]+){1,2}', value):
                  fail('Invalid version in Supabase app_config.latest_version.')
              digits = [int(n) for n in value.split('.')]
              return tuple((digits + [0, 0, 0])[:3])

          old_version = rows[0]['latest_version']
          if parts(version) <= parts(old_version):
              fail(f'Supabase latest is already {old_version}; refusing same/older version {version}. For a changed installer, publish a NEW version.')

          print(f'Release {tag} located; downloading {filename} and calculating SHA-256.', flush=True)
          checksum = hashlib.sha256()
          downloaded = 0
          req = urllib.request.Request(download_url, headers={'User-Agent': 'ZeroVega-Release-Publisher'})
          try:
              with urllib.request.urlopen(req, timeout=120) as response:
                  while True:
                      data = response.read(1024 * 1024)
                      if not data:
                          break
                      checksum.update(data)
                      downloaded += len(data)
                      if downloaded > 2 * 1024**3:
                          fail('Installer exceeds 2 GiB maximum.')
          except urllib.error.HTTPError as exc:
              fail(f'Could not download release installer (HTTP {exc.code}). The updater requires a publicly downloadable GitHub release asset.')
          except urllib.error.URLError as exc:
              fail(f'Could not download release installer: {exc.reason}')
          if downloaded != expected_size:
              fail(f'Incomplete installer download: expected {expected_size}, got {downloaded} bytes.')

          payload = json.dumps({
              'latest_version': version,
              'minimum_version': version,
              'download_url': download_url,
              'installer_sha256': checksum.hexdigest(),
          }).encode('utf-8')
          patch_headers = {**api_headers, 'Content-Type': 'application/json', 'Prefer': 'return=representation'}
          try:
              with urllib.request.urlopen(urllib.request.Request(api, data=payload, headers=patch_headers, method='PATCH'), timeout=30) as r:
                  changed = json.load(r)
          except urllib.error.HTTPError as exc:
              fail(f'Supabase app_config update failed (HTTP {exc.code}). Check the key and table permissions.')
          if len(changed) != 1 or changed[0].get('latest_version') != version or changed[0].get('minimum_version') != version:
              fail('Supabase did not confirm the expected latest_version/minimum_version update.')

          print(f'SUCCESS: Supabase latest_version={version}, minimum_version={version}')
          print(f'Installer: {filename} ({downloaded:,} bytes)')
          print('Supabase installer URL and SHA-256 checksum updated.')
          PY
