# Place this file at .github/workflows/zerovega-auto-release.yml
# Upload and TEST the Windows installer BEFORE publishing a GitHub Release.
name: Publish ZeroVega release to Supabase

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: zerovega-supabase-production
  cancel-in-progress: false

jobs:
  update-supabase:
    # Only ordinary published releases, never prereleases.
    if: ${{ !github.event.release.draft && !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - name: Verify installer, calculate SHA-256, and publish mandatory version
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          def fail(message):
              raise SystemExit("ERROR: " + message)

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as f:
              event = json.load(f)
          release = event["release"]
          tag = release["tag_name"]
          if not re.fullmatch(r"v[0-9]+(?:\.[0-9]+){1,2}", tag):
              fail("Release tag must look like v1.3 or v1.3.1")
          version = tag[1:]
          file_name = f"ZeroVegaSetup_{version}.exe"
          assets = [a for a in release.get("assets", []) if a["name"] == file_name]
          if len(assets) != 1:
              fail(f"Attach {file_name} to the release BEFORE clicking Publish")
          asset = assets[0]
          download_url = asset["browser_download_url"]
          if not download_url.startswith("https://github.com/"):
              fail("Unexpected installer host; expected github.com")
          if int(asset.get("size", 0)) == 0:
              fail("Installer is empty")

          base = os.environ.get("SUPABASE_URL", "").rstrip("/")
          key = os.environ.get("SUPABASE_SECRET_KEY", "")
          if not re.fullmatch(r"https://[a-z0-9-]+\.supabase\.co", base):
              fail("Set SUPABASE_URL to your project's https://...supabase.co URL")
          if not key.startswith("sb_secret_"):
              fail("SUPABASE_SECRET_KEY must be a new sb_secret_... key")
          api = base + "/rest/v1/app_config?config_key=eq.production"
          api_headers = {"apikey": key, "Accept": "application/json"}

          # Do not accidentally replace the newest release with an older one.
          url = api + "&select=latest_version"
          with urllib.request.urlopen(
              urllib.request.Request(url, headers=api_headers), timeout=30
          ) as r:
              current_rows = json.load(r)
          if len(current_rows) != 1:
              fail("Expected exactly one app_config row for config_key=production")

          def parts(v):
              if not re.fullmatch(r"[0-9]+(?:\.[0-9]+){1,2}", v):
                  fail("Invalid version in database: " + v)
              numbers = [int(n) for n in v.split(".")]
              return tuple((numbers + [0, 0, 0])[:3])

          existing = current_rows[0]["latest_version"]
          if parts(version) <= parts(existing):
              fail(f"Refusing non-new release {version}; current latest is {existing}")

          # Download the actual release asset to calculate its SHA-256.
          digest = hashlib.sha256()
          downloaded = 0
          request = urllib.request.Request(
              download_url,
              headers={"User-Agent": "ZeroVega-GitHub-Actions-Release"},
          )
          with urllib.request.urlopen(request, timeout=120) as response:
              while True:
                  chunk = response.read(1024 * 1024)
                  if not chunk:
                      break
                  digest.update(chunk)
                  downloaded += len(chunk)
          if downloaded != int(asset["size"]):
              fail("Incomplete installer download; Supabase not changed")
          checksum = digest.hexdigest()

          payload = json.dumps({
              "latest_version": version,
              "minimum_version": version,
              "download_url": download_url,
              "installer_sha256": checksum,
              "updated_at": datetime.now(timezone.utc).isoformat(),
          }).encode("utf-8")
          headers = dict(api_headers)
          headers.update({"Content-Type": "application/json", "Prefer": "return=representation"})
          patch = urllib.request.Request(api, data=payload, headers=headers, method="PATCH")
          with urllib.request.urlopen(patch, timeout=30) as response:
              changed = json.load(response)
          if len(changed) != 1 or changed[0]["latest_version"] != version:
              fail("Supabase did not confirm the expected app_config update")

          print(f"SUCCESS: ZeroVega {version} published as mandatory.")
          print(f"Installer: {file_name} ({downloaded:,} bytes)")
          print("Supabase latest_version and minimum_version updated.")
          print("Installer URL and SHA-256 stored in app_config.")
          PY
